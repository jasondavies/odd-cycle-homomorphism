version: "v0.4"

project:
  name: "List elimination into odd-cycle homomorphism with additive structural bounds"
  description: >-
    For every finite List Colouring instance on a graph F with lists in Z/nZ,
    where n is odd and at least five, there exists a finite simple graph G
    that maps to the cycle C_n exactly when the instance is list-colourable.
    The same graph has treewidth at most max(tw(F)+2,3), pathwidth at most
    pw(F)+6, and feedback vertex number at most fvs(F)+2. The theorem also
    transfers supplied decomposition certificates and any feedback vertex set,
    with exactly two extra vertices in the latter set. The target has pathwidth
    at most two. The source is 2-degenerate, has girth at least n (exactly n
    for nonempty F), is connected when every list omits a residue, and satisfies
    explicit polynomial vertex and linear edge bounds. The proved witness is
    the repository's reference-cycle and inequality-path construction. This
    submission records a finite structural theorem; the manuscript's complexity
    classifications and machine resource analysis are not part of the formal
    statement. Under a common forbidden last coordinate, the statement includes
    matching treewidth and feedback-number bounds for inputs with an edge and a
    pathwidth lower bound for nonempty inputs. It also includes target capping
    and the target-free odd-cycle-core reduction for the same witness graph.
  authors:
    - Jason Davies
  responsible_maintainers:
    - Jason Davies
  license: Apache-2.0

